<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
</head>
<body>
    <h1>Create Course</h1>

    <input type="text" id="name" placeholder="Name Course">
    <input type="number" id="credits" placeholder="Credits">
    <br><br>

    <button onclick="createCourse()">Create</button>
    <button onclick="location.href='index.html'">Return</button>

    <script>
        const API_URL = 'http://localhost:3001/course';

        async function createCourse() {
            const name = document.getElementById('name').value;
            const credits = document.getElementById('credits').value;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, credits })
            });

            if (response.ok) {
                alert('Successfully created course');
                document.getElementById('name').value = '';
                document.getElementById('credits').value = '';
            } else {
                alert('Error creating course');
            }
        }
    </script>
</body>
</html>
