<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Professor</title>
    <link rel="stylesheet" href="../CSS/tabla.css">
</head>

<body>

    <h1>Create Professor</h1>

    <input type="text" id="name" placeholder="Name Professor">
    <input type="text" id="lastName" placeholder="Last Name">
    <input type="text" id="idCard" placeholder="ID Card">
    <input type="number" id="age" placeholder="Age" min="1" max="120">

    <br><br>

    <button id="btnSave" onclick="createProfessor()">Create</button>
    <button onclick="location.href='index.html'">Return</button>

    <h2>Professor List</h2>
    <div id="professorList"></div>

    <script>

        // Al cargar ejecuta las siguiente funcion
        window.onload = function () {
            listarProfesores();
        };

        //Listar Profesores
        function listarProfesores() {
            //Se creo el objeto para hacer las peticiones de HTTP
            const ajaxRequest = new XMLHttpRequest();
            // Un nuevo evento, se ejecuta cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                // Si la accion es exitosa
                if (this.status === 200) {
                    // Covierte el JSON en javaScritp (objeto o arreglo)
                    const professors = JSON.parse(this.responseText);
                    // Construcion de la tabla dinamica
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Last Name</th>
                                    <th>ID Card</th>
                                    <th>Age</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    // recorre el (arreglo) y agrega una fila a la tabla
                    professors.forEach(professor => {
                        html += `
                            <tr>
                                <td>${professor.name}</td>
                                <td>${professor.lastName}</td>
                                <td>${professor.idCard}</td>
                                <td>${professor.age}</td>
                                <td>
                                    <button class="btn-edit" onclick="llenarFormularioProfessor('${professor._id}')">Edit</button>
                                    <button class="btn-delete" onclick="deleteProfessor('${professor._id}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `
                            </tbody>
                        </table>
                    `;
                    //Se agrega la tabla (html) al contenedor vacio (reemplazar)
                    document.getElementById('professorList').innerHTML = html;
                }
            });
            //Se hace la peticion get a la URL
            ajaxRequest.open("GET", "http://localhost:3001/professor");
            //Se envia la peticion al servidor
            ajaxRequest.send();
        }

        //Crear Profesor 
        function createProfessor() {
            //Se obtienen los valores de los campos
            const name = document.getElementById('name').value;
            const lastName = document.getElementById('lastName').value;
            const idCard = document.getElementById('idCard').value;
            const age = Number(document.getElementById('age').value);

            if (!name || !lastName || !idCard || age <= 0) {
                alert("Todos los campos son requeridos");
                return;
            }

            //Creación del objeto ajax
            const ajaxRequest = new XMLHttpRequest();
            // evento 
            ajaxRequest.addEventListener("load", function () {
                //Si es exitoso
                if (this.status === 201) {
                    //Profesor creado
                    alert('Successfully created professor');
                    //Limpiar los campos
                    clearForm();
                    //Actualizar la tabla (refresh)
                    listarProfesores();
                } else {
                    //Error al crear profesor
                    alert('Error creating professor');
                }
            });
            // Configuración de la Peticion HTTP
            ajaxRequest.open("POST", "http://localhost:3001/professor");
            // Datos en formato JSON
            ajaxRequest.setRequestHeader("Content-Type", "application/json");
            // Convierte el objeto en JSON
            const body = JSON.stringify({ name, lastName, idCard, age });
            ajaxRequest.send(body);
        }

        //Eliminar profesor
        function deleteProfessor(professorId) {
            //Mesaje de confirmación antes de eliminar
            if (!confirm("Are you sure you want to delete this professor?")) {
                return;
            }
            //Se creo un objeto de ajax
            const ajaxRequest = new XMLHttpRequest();
            //Evento que se ejecuta cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                //Exito
                if (this.status === 200) {
                    // Mensaje de exito
                    alert("Professor deleted");
                    //(Refresh)
                    listarProfesores();
                } else {
                    // Error
                    alert("Error deleting professor");
                }
            });
            //Configuracion de la peticion
            ajaxRequest.open("DELETE", `http://localhost:3001/professor/${professorId}`);
            ajaxRequest.send();
        }

        //Llenar formulario 
        function llenarFormularioProfessor(professorId) {
            //Se creo un objeto de ajax
            const ajaxRequest = new XMLHttpRequest();
            //Evento que se ejecutra cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                //Exito
                if (this.status === 200) {
                    // Se convierte el JSON a javaScript
                    const professor = JSON.parse(this.responseText);
                    //Se llenan los campos con los valores correspondientes
                    document.getElementById('name').value = professor.name;
                    document.getElementById('lastName').value = professor.lastName;
                    document.getElementById('idCard').value = professor.idCard;
                    document.getElementById('age').value = professor.age;
                    //Busca el id del boton (guardar)
                    const btn = document.getElementById("btnSave");
                    //Se cambia el nombre por (editar)
                    btn.textContent = "Update";
                    //Cambia el funcionamineto del bonton 
                    btn.onclick = function () {
                        updateProfessor(professorId);
                    };

                } else {
                    //Error
                    alert("Error loading professor");
                }
            });
            // Se configura la peticion http
            ajaxRequest.open("GET", `http://localhost:3001/professor?id=${professorId}`);
            ajaxRequest.send();
        }

        //Edita profesor
        function updateProfessor(professorId) {
            //Se obtienen los datos de los campos (input)
            const name = document.getElementById('name').value;
            const lastName = document.getElementById('lastName').value;
            const idCard = document.getElementById('idCard').value;
            const age = Number(document.getElementById('age').value);
            //Creacion del objeto ajax (petición)
            const ajaxRequest = new XMLHttpRequest();

            if (!name || !lastName || !idCard || age <= 0) {
                alert("Todos los campos son requeridos");
                return;
            }

            //Evento que se ejecutra cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                //Exito
                if (this.status === 200) {
                    // Mensaje de exito
                    alert("Professor updated");
                    //Limpiar los campos
                    clearForm();
                    //Busca el id del boton (guardar)
                    const btn = document.getElementById("btnSave");
                    //Le devuelve el nombre original (crear)
                    btn.textContent = "Create";
                    // Despues de hacer click devuelve la fucnion original
                    btn.onclick = createProfessor;
                    //(Refresh)
                    listarProfesores();

                } else {
                    //Error
                    clearForm();
                    alert("Error updating professor");
                }
            });
            // Se configura la peticion http
            ajaxRequest.open("PUT", `http://localhost:3001/professor/${professorId}`);
            // Datos en formato JSON
            ajaxRequest.setRequestHeader("Content-Type", "application/json");
            // Convierte el objeto en JSON
            const body = JSON.stringify({ name, lastName, idCard, age });
            ajaxRequest.send(body);
        }

        //Permite limpiar los campos
        function clearForm() {
            document.getElementById('name').value = '';
            document.getElementById('lastName').value = '';
            document.getElementById('idCard').value = '';
            document.getElementById('age').value = '';
        }

    </script>

</body>
</html>
