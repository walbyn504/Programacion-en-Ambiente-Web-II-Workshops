<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Course</title>
    <link rel="stylesheet" href="../CSS/tabla.css">


</head>

<body>

    <h1>Create Course</h1>

    <input type="text" id="name" placeholder="Name Course">
    <input type="number" id="credits" placeholder="Credits" min="0">
    <input type="text" id="code" placeholder="Code">
    <input type="text" id="description" placeholder="Description">
    <select id="professorId"></select>
    <br><br>

    <button id="btnSave" onclick="createCourse()">Create</button>
    <button onclick="location.href='index.html'">Return</button>

    <h2>Course List</h2>
    <div id="courseList"></div>

    <script>

        // Carga en la pagina al iniciar
        window.onload = function () {
            listaProfessor();
            getCourses();
        };

        //Lista los profesores
        function listaProfessor() {

            const ajaxRequest = new XMLHttpRequest();
            //Evento que se ejecutra cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                //Exito
                if (this.status === 200) {
                    // Convierte el JSON en formato javaScript
                    const professors = JSON.parse(this.responseText);
                    // Busca el select con id
                    const select = document.getElementById("professorId");
                    // Reemplaza la información que tiene el select
                    select.innerHTML = '<option value="">Select Professor</option>';
                    professors.forEach(professor => {
                        //Crea una nueva opción
                        const option = document.createElement("option");
                        //Asiga el valor 
                        option.value = professor._id;
                        option.textContent = professor.name + " " + professor.lastName;
                        // Agregarlo
                        select.appendChild(option);
                    });

                } else {
                    alert("Error loading professors");
                }
            });

            ajaxRequest.open("GET", "http://localhost:3001/professor");
            ajaxRequest.send();
        }

        //Lista los cursos
        function getCourses() {

            // Se crea el objeto AJAX que hara la llamada HTTP
            const ajaxRequest = new XMLHttpRequest();
            ////Evento que se ejecutra cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                if (this.status === 200) {
                    //Covierte l JSON en javaScript
                    const courses = JSON.parse(this.responseText);
                    //Tabla dinamica
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Credits</th>
                                    <th>Code</th>
                                    <th>Description</th>
                                    <th>Professor</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    //Recorrido
                    courses.forEach(course => {
                        html += `
                            <tr>
                                <td>${course.name}</td>
                                <td>${course.credits}</td>
                                <td>${course.code}</td>
                                <td>${course.description}</td>
                                <td>
                                    ${course.professorId.name + " " + course.professorId.lastName}
                                </td>
                                <td>
                                    <button class="btn-edit" onclick="llenarFormularioCourse('${course._id}')">Edit</button>
                                    <button class="btn-delete" onclick="deleteCourse('${course._id}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `
                            </tbody>
                        </table>
                    `;
                    //Se agrega la tabla (html) al contenedor vacio (reemplazar)
                    document.getElementById('courseList').innerHTML = html;
                }
            });

            ajaxRequest.open("GET", "http://localhost:3001/course");
            ajaxRequest.send();
        }

        function createCourse() {
            //Se obtienen los valores de los campos
            const name = document.getElementById('name').value;
            const credits = Number(document.getElementById('credits').value);
            const code = document.getElementById('code').value;
            const description = document.getElementById('description').value;
            const professorId = document.getElementById('professorId').value;

            // Validar que los campos vengan llenos
            if (!name || credits <= 0 || !code || !description || !professorId) {
                alert("Todos los campos son requeridos");
                return;
            }

            // Se crea el objeto AJAX que hara la llamada HTTP
            const ajaxRequest = new XMLHttpRequest();
            //Evento que se ejecuta cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                if (this.status === 201) {
                    alert('Successfully created course');

                    // Limpiar campos
                    clearForm();

                    // Refresca la tabla despues de eliminar el elemento
                    getCourses();

                } else {
                    alert("Error creating course");
                }
            });
            //Configuracion de la peticion http
            ajaxRequest.open("POST", "http://localhost:3001/course");
            ajaxRequest.setRequestHeader("Content-Type", "application/json");
            // Covierte el arreglo a JSON
            const body = JSON.stringify({ name, credits, code, description, professorId });
            ajaxRequest.send(body);
        }

        function deleteCourse(courseId) {
            //Confirmacion de mensaje de eliminacion
            if (!confirm("Are you sure you want to delete this course?")) {
                return;
            }
            // Se crea el objeto AJAX que hara la llamada HTTP
            const ajaxRequest = new XMLHttpRequest();
            ////Evento que se ejecuta cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                if (this.status === 200) {
                    alert("Course deleted");
                    getCourses(); // Refresca la tabla luego de editar el elemento
                } else {
                    alert("Error deleting course");
                }
            });

            ajaxRequest.open("DELETE", `http://localhost:3001/course/${courseId}`);
            ajaxRequest.send();
        }

        function llenarFormularioCourse(courseId) {

            const ajaxRequest = new XMLHttpRequest();
            //Evento que se ejecuta cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                if (this.status === 200) {

                    const course = JSON.parse(this.responseText);
                    //Busca el campo y pasa los datos a travez del id
                    document.getElementById('name').value = course.name;
                    document.getElementById('credits').value = course.credits;
                    document.getElementById('code').value = course.code;
                    document.getElementById('description').value = course.description;
                    document.getElementById('professorId').value = course.professorId._id;
                    //Busca el id del boton (guardar)
                    const btn = document.getElementById("btnSave");
                    //Se cambia el nombre por (editar)
                    btn.textContent = "Update";
                    //Cambia el funcionamineto del bonton 
                    btn.onclick = function () {
                        updateCourse(courseId);
                    };


                } else {
                    alert("Error loading course");
                }
            });

            ajaxRequest.open("GET", `http://localhost:3001/course?id=${courseId}`);
            ajaxRequest.send();
        }

        function updateCourse(courseId) {

            // Obteniendo los datos del formulario
            const name = document.getElementById('name').value;
            const credits = Number(document.getElementById('credits').value);
            const code = document.getElementById('code').value;
            const description = document.getElementById('description').value;
            const professorId = document.getElementById('professorId').value;

            // Validar que los campos vengan llenos
            if (!name || credits <= 0 || !code || !description || !professorId) {
                alert("Todos los campos son requeridos");
                return;
            }
            
            // Se crea el objeto AJAX que hara la llamada HTTP
            const ajaxRequest = new XMLHttpRequest();
            //Evento que se ejecuta cuando el servidor responda
            ajaxRequest.addEventListener("load", function () {
                if (this.status === 200) {
                    alert("Course updated");

                    //Limpiar lo campos
                    clearForm();

                    // Restaurar botón
                    const btn = document.getElementById("btnSave");
                    btn.textContent = "Create";
                    btn.onclick = createCourse;
                    // refrescar tabla
                    getCourses();

                } else {
                    alert("Error updating course");
                }
            });

            ajaxRequest.open("PUT", `http://localhost:3001/course/${courseId}`);
            ajaxRequest.setRequestHeader("Content-Type", "application/json");

            const body = JSON.stringify({ name, credits, code, description, professorId });
            ajaxRequest.send(body);
        }

        //Permite limpiar los campos
        function clearForm() {
            document.getElementById('name').value = '';
            document.getElementById('credits').value = '';
            document.getElementById('code').value = '';
            document.getElementById('description').value = '';
            document.getElementById('professorId').value = '';
        }

    </script>

</body>
</html>
