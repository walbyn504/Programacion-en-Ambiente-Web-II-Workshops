<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Course</title>
    <link rel="stylesheet" href="../CSS/tabla.css">


</head>

<body>

    <h1>Create Course</h1>

    <input type="text" id="name" placeholder="Name Course">
    <input type="number" id="credits" placeholder="Credits">
    <input type="text" id="code" placeholder="Code">
    <input type="text" id="description" placeholder="Description">
    <select id="professorId"></select>
    <br><br>

    <button onclick="createCourseAJAX()">Create</button>
    <button onclick="location.href='index.html'">Return</button>

    <h2>Course List</h2>
    <div id="courseList"></div>

    <script>

        // Carga en la pagina al iniciar
        window.onload = function () {
            loadProfessors();
            getCoursesAJAX();
        };

        //Lista los profesores
        function loadProfessors() {

            // Se crea el objeto AJAX que hara la llamada HTTP
            const ajaxRequest = new XMLHttpRequest();

            ajaxRequest.addEventListener("load", function () {
                if (this.status === 200) {
                    const professors = JSON.parse(this.responseText);
                    const select = document.getElementById("professorId");

                    select.innerHTML = '<option value="">Select Professor</option>';

                    professors.forEach(professor => {
                        const option = document.createElement("option");
                        option.value = professor._id;
                        option.textContent = professor.name + " " + professor.lastName;
                        select.appendChild(option);
                    });

                } else {
                    alert("Error loading professors");
                }
            });

            ajaxRequest.open("GET", "http://localhost:3001/professor");
            ajaxRequest.send();
        }

        //Lista los cursos
        function getCoursesAJAX() {

            // Se crea el objeto AJAX que hara la llamada HTTP
            const ajaxRequest = new XMLHttpRequest();

            ajaxRequest.addEventListener("load", function () {
                if (this.status === 200) {
                    const courses = JSON.parse(this.responseText);

                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Credits</th>
                                    <th>Code</th>
                                    <th>Description</th>
                                    <th>Professor</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    courses.forEach(course => {
                        html += `
                            <tr>
                                <td>${course.name}</td>
                                <td>${course.credits}</td>
                                <td>${course.code || " "}</td>
                                <td>${course.description || " "}</td>
                                <td>
                                    ${
                                    //Verifica que el id del profesor no sea nulo y que un objeto valido
                                    // typeof (pregunta si es objeto o string) si es objeto extrae el (nombre y apellido) del elemento
                                    // En caso contrario usara el (nombre y apellido) directo
                                        course.professorId && typeof course.professorId === "object"
                                        ? course.professorId.name + " " + course.professorId.lastName
                                        : "No Professor"
                                    }
                                </td>
                                <td>
                                    <button class="btn-edit" onclick="editCourse('${course._id}')">Edit</button>
                                    <button class="btn-delete" onclick="deleteCourse('${course._id}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `
                            </tbody>
                        </table>
                    `;

                    document.getElementById('courseList').innerHTML = html;
                }
            });

            ajaxRequest.open("GET", "http://localhost:3001/course");
            ajaxRequest.send();
        }

        function createCourseAJAX() {
            const name = document.getElementById('name').value;
            const credits = Number(document.getElementById('credits').value);
            const code = document.getElementById('code').value;
            const description = document.getElementById('description').value;
            const professorId = document.getElementById('professorId').value;

            // Se crea el objeto AJAX que hara la llamada HTTP
            const ajaxRequest = new XMLHttpRequest();

            ajaxRequest.addEventListener("load", function () {
                if (this.status === 201) {
                    alert('Successfully created course');

                    // Limpiar campos
                    document.getElementById('name').value = '';
                    document.getElementById('credits').value = '';
                    document.getElementById('code').value = '';
                    document.getElementById('description').value = '';
                    document.getElementById('professorId').value = '';

                    // Refresca la tabla despues de eliminar el elemento
                    getCoursesAJAX();

                } else {
                    const response = JSON.parse(this.responseText);
                    alert(response.message);
                }
            });

            ajaxRequest.open("POST", "http://localhost:3001/course");
            ajaxRequest.setRequestHeader("Content-Type", "application/json");

            const body = JSON.stringify({ name, credits, code, description, professorId });
            ajaxRequest.send(body);
        }

        function deleteCourse(courseId) {

            if (!confirm("Are you sure you want to delete this course?")) {
                return;
            }
            // Se crea el objeto AJAX que hara la llamada HTTP
            const ajaxRequest = new XMLHttpRequest();

            ajaxRequest.addEventListener("load", function () {
                if (this.status === 200) {
                    alert("Course deleted");
                    getCoursesAJAX(); // Refresca la tabla luego de editar el elemento
                } else {
                    alert("Error deleting course");
                }
            });

            ajaxRequest.open("DELETE", `http://localhost:3001/course/${courseId}`);
            ajaxRequest.send();
        }

        function editCourse(courseId) {

            const ajaxRequest = new XMLHttpRequest();

            ajaxRequest.addEventListener("load", function () {
                if (this.status === 200) {

                    const course = JSON.parse(this.responseText);
                    // Busca el input (campo) con cada nombre respectivo y le asigna el nombre 
                    // del curso que se quiere editar (llenan los campos)
                    document.getElementById('name').value = course.name;
                    document.getElementById('credits').value = course.credits;
                    document.getElementById('code').value = course.code;
                    document.getElementById('description').value = course.description;
                    document.getElementById('professorId').value = 
                        // typeof (pregunta si es objeto o string) si es objeto extrae el ID del elemento
                        // En caso contrario usara el ID directo
                        typeof course.professorId === "object"
                        ? course.professorId._id
                        : course.professorId;

                    // Encuentre el que tiene la funcion (createCourseAJAX)
                    const createBtn = document.querySelector("button[onclick='createCourseAJAX()']");
                    // Cambia en nombre del boton (create) por (update)
                    createBtn.textContent = "Update";
                    // Ahora el boton ejecutara la funcion updateCourseAJAX
                    createBtn.onclick = function () {
                        // Pasamos el ID del curso que se va a editar
                        updateCourseAJAX(courseId);
                    };

                } else {
                    alert("Error loading course");
                }
            });

            ajaxRequest.open("GET", `http://localhost:3001/course?id=${courseId}`);
            ajaxRequest.send();
        }

        function updateCourseAJAX(courseId) {

            // Obteniendo los datos del formulario
            const name = document.getElementById('name').value;
            const credits = Number(document.getElementById('credits').value);
            const code = document.getElementById('code').value;
            const description = document.getElementById('description').value;
            const professorId = document.getElementById('professorId').value;
            
            // Se crea el objeto AJAX que hara la llamada HTTP
            const ajaxRequest = new XMLHttpRequest();

            ajaxRequest.addEventListener("load", function () {
                if (this.status === 200) {
                    alert("Course updated");

                    // Limpiar formulario
                    document.getElementById('name').value = '';
                    document.getElementById('credits').value = '';
                    document.getElementById('code').value = '';
                    document.getElementById('description').value = '';
                    document.getElementById('professorId').value = '';

                    // Restaurar botón
                    const createBtn = document.querySelector("button");
                    createBtn.textContent = "Create";
                    createBtn.setAttribute("onclick", "createCourseAJAX()");

                    getCoursesAJAX(); // refrescar tabla

                } else {
                    alert("Error updating course");
                }
            });

            ajaxRequest.open("PUT", `http://localhost:3001/course/${courseId}`);
            ajaxRequest.setRequestHeader("Content-Type", "application/json");

            const body = JSON.stringify({ name, credits, code, description, professorId });
            ajaxRequest.send(body);
        }

    </script>

</body>
</html>
