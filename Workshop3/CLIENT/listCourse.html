<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>List Course</title>
</head>
<script>
  function getCoursesAJAX() {
    //Creación del objeto XMLHttpRequest
    //Hacer petición HTTP al servidor
    const ajaxRequest = new XMLHttpRequest();
    ajaxRequest.addEventListener("load", function () {
      const courses = JSON.parse(this.responseText);
      //Lista HTML de forma dinámica
      let html = '<ul>';

      courses.forEach(course => {
        html += `<li>${course.name} (${course.credits} credits)</li>`;
      });
      //Cierre de la lista
      html += '</ul>';
      document.getElementById('courseList').innerHTML = html;
    });

    ajaxRequest.open("GET", "http://localhost:3001/course");
    ajaxRequest.send();
  }
</script>
<body>
    <h1>List Course</h1>

    <button onclick="getCoursesAJAX()">Load courses</button>
    <button onclick="location.href='index.html'">Return</button>

    <ul id="courseList"></ul>
</body>
</html>
